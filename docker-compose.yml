version: "3.8"


services:
  db:
    image: postgres:16-alpine
    container_name: fraud_detection_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password_secure_2026
      POSTGRES_DB: fraud_detection_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_detection_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fraud_detection_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fraud_user:fraud_password_secure_2026@db:5432/fraud_detection_db
      - SECRET_KEY=academic-fraud-detection-jwt-secret-key-change-in-prod-2026
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASSWORD=
      - SMTP_FROM_EMAIL=security@frauddetection.local
      - MODEL_WEIGHT=0.65
      - BEHAVIOURAL_WEIGHT=0.35
    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fraud_detection_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend


volumes:
  postgres_data:
